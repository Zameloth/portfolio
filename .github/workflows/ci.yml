name: CI

# Le déploiement revient au timer de Zameloth/self-host, qui rebuild l'image
# sur aspire à chaque commit de main : la CI vérifie seulement qu'elle se build.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
